name: Release

# Publishes one package when a GitHub release is published. The tag names the
# package and its version: mcp-core-v<version> or mcp-v<version>. The tarball
# is built and tested once without credentials, attested, and published
# unchanged from a protected environment with trusted publishing and npm
# provenance. A version npm already has is verified byte-for-byte and never
# overwritten.
#
# Retry by running this workflow on the release tag:
#   gh workflow run release.yml --ref mcp-v0.1.1
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - id: plan
        name: Match the tag to a package version
        run: |
          [[ "$GITHUB_REF" =~ ^refs/tags/(mcp|mcp-core)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::Run this workflow on an mcp-v<version> or mcp-core-v<version> tag, not $GITHUB_REF"; exit 1; }
          # mcp-core -> packages/core, mcp -> packages/mcp
          directory="packages/${BASH_REMATCH[1]#mcp-}"
          name="$(jq -r .name "$directory/package.json")"
          version="$(jq -r .version "$directory/package.json")"
          test "$version" = "${BASH_REMATCH[2]}" || { echo "::error::$directory/package.json is $version, the tag is ${BASH_REMATCH[2]}"; exit 1; }
          { echo "directory=$directory"; echo "name=$name"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Require the published core this package depends on
        if: steps.plan.outputs.name == '@photon-ai/mcp'
        run: |
          core="$(jq -r .version packages/core/package.json)"
          npm view "@photon-ai/mcp-core@$core" version >/dev/null || { echo "::error::Release @photon-ai/mcp-core $core before @photon-ai/mcp"; exit 1; }
      - name: Pack
        run: |
          pnpm --filter "${{ steps.plan.outputs.name }}" pack --pack-destination "$GITHUB_WORKSPACE/dist"
          mkdir "$RUNNER_TEMP/extracted" && tar -xzf dist/*.tgz -C "$RUNNER_TEMP/extracted"
          node tools/public-content/check.mjs --tree "$RUNNER_TEMP/extracted"
      - name: Install the tarball from npm and list tools
        if: steps.plan.outputs.name == '@photon-ai/mcp'
        run: |
          mkdir "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/dist/*.tgz
          node "$GITHUB_WORKSPACE/packages/mcp/scripts/smoke.mjs" node_modules/@photon-ai/mcp/dist/cli.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-npm
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 90

  # No dependency code runs here.
  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-npm
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

  # Only this job publishes: protected environment, trusted publishing (OIDC),
  # npm provenance, no dependency code. npm trusts only an existing package,
  # so each package's first release uses the one-time NPM_BOOTSTRAP_TOKEN,
  # which is revoked afterwards.
  npm:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-npm
          path: dist
      - id: registry
        run: node scripts/registry-check.mjs plan "${{ needs.build.outputs.name }}" "${{ needs.build.outputs.version }}" dist
      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        env:
          # Empty after the first release: npm then uses trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish ./dist/*.tgz --access public --provenance --ignore-scripts
      - name: Verify the registry bytes
        run: node scripts/registry-check.mjs verify "${{ needs.build.outputs.name }}" "${{ needs.build.outputs.version }}" dist
