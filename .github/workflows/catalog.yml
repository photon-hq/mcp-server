name: Refresh catalog

# Keeps the local server's tools in step with the production API. Daily, it
# refreshes the committed catalog source from api.photon.codes; when the
# source changes it verifies the build, bumps @photon-ai/mcp's patch version
# and opens a pull request that lists added and removed tools. The catalog
# comes from APIs production already serves, so once the pull request's checks
# pass this job merges it and publishes the version with an mcp-v<version>
# release. A failing check leaves the pull request open for a person.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

# The org blocks Actions from opening pull requests, and pull requests opened
# with GITHUB_TOKEN would not run CI: a GitHub App token opens them instead.
permissions:
  contents: read

concurrency:
  group: refresh-catalog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the current tools
        run: |
          pnpm build
          cp -R packages/mcp/.release/production "$RUNNER_TEMP/before"
      - run: pnpm --filter @photon-ai/mcp refresh-catalog
      - id: diff
        run: |
          if git diff --quiet -- packages/mcp/catalog; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the refreshed catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          pnpm verify
          pnpm --filter @photon-ai/mcp smoke
      - name: Bump the patch version and describe the change
        id: bump
        if: steps.diff.outputs.changed == 'true'
        run: |
          IFS=. read -r major minor patch < <(jq -r .version packages/mcp/package.json)
          version="$major.$minor.$((patch + 1))"
          (cd packages/mcp && npm pkg set "version=$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          after=packages/mcp/.release/production
          added="$(comm -13 <(sort "$RUNNER_TEMP/before/tools.txt") <(sort "$after/tools.txt") | paste -sd, - | sed 's/,/, /g')"
          removed="$(comm -23 <(sort "$RUNNER_TEMP/before/tools.txt") <(sort "$after/tools.txt") | paste -sd, - | sed 's/,/, /g')"
          {
            echo "- Tools refreshed from the production API: $(wc -l < "$RUNNER_TEMP/before/tools.txt" | tr -d ' ') → $(wc -l < "$after/tools.txt" | tr -d ' ') tools."
            if [[ -n "$added" ]]; then echo "- Added: $added."; fi
            if [[ -n "$removed" ]]; then echo "- Removed: $removed."; fi
            if [[ -z "$added$removed" ]]; then echo "- Same tools; schemas or descriptions changed."; fi
          } > "$RUNNER_TEMP/notes.md"
          {
            echo "Refreshes the local server's tools from the production OpenAPI and bumps \`@photon-ai/mcp\` to $version."
            echo
            echo "**Tools:** $(wc -l < "$RUNNER_TEMP/before/tools.txt" | tr -d ' ') → $(wc -l < "$after/tools.txt" | tr -d ' ')"
            echo
            echo '```diff'
            diff -U0 "$RUNNER_TEMP/before/tools.txt" "$after/tools.txt" | grep -E '^[+-][^+-]' || echo "  (same tools; schemas or descriptions changed)"
            echo '```'
            echo
            echo "**Operations outside OAuth scopes:**"
            echo
            echo '```diff'
            diff -U0 "$RUNNER_TEMP/before/excluded.json" "$after/excluded.json" | grep -E '^[+-][^+-]' || echo "  (unchanged)"
            echo '```'
            echo
            echo "CI ran \`pnpm verify\` and the stdio smoke test on this catalog. Once this pull request's checks pass, the workflow merges it and publishes \`mcp-v$version\`; a failing check leaves it open."
          } > "$RUNNER_TEMP/body.md"
      # Every run needs the token: the release step also recovers a merge an
      # earlier run could not release.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/refresh-catalog
          delete-branch: true
          commit-message: "chore(mcp): refresh the local catalog from the production API"
          title: "chore(mcp): refresh the local catalog from the production API"
          body-path: ${{ runner.temp }}/body.md
          add-paths: |
            packages/mcp/catalog
            packages/mcp/package.json
      # Wait for these checks to report on the pull request's head and pass; a
      # check that has not registered yet must not look like a pass.
      - name: Merge once the checks pass
        id: merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          REQUIRED: '["Verify (Node 22)", "Verify (Node 24)", "conventional-title", "linear-link"]'
        run: |
          for _ in $(seq 1 120); do
            IFS=$'\t' read -r state head < <(gh pr view "$PR" --json state,headRefOid --jq '[.state, .headRefOid] | @tsv')
            [[ "$state" == MERGED ]] && break
            [[ "$state" == OPEN ]] || { echo "::error::Pull request #$PR is $state"; exit 1; }
            # Read after the head: if another push lands in between, the merge
            # below names the older head and GitHub refuses it.
            checks="$(gh pr checks "$PR" --json name,bucket 2>/dev/null)" || true
            [[ -n "$checks" ]] || checks='[]'
            if jq -e 'any(.[]; .bucket == "fail" or .bucket == "cancel")' <<<"$checks" >/dev/null; then
              echo "::error::A check failed on pull request #$PR; it stays open for review"
              exit 1
            fi
            if jq -e --argjson required "$REQUIRED" \
              '($required - map(select(.bucket == "pass") | .name) | length == 0) and all(.[]; .bucket == "pass" or .bucket == "skipping")' \
              <<<"$checks" >/dev/null; then
              gh pr merge "$PR" --squash --match-head-commit "$head" \
                --subject "chore(mcp): refresh the local catalog from the production API (#$PR)" --body ""
              break
            fi
            sleep 20
          done
          [[ "$(gh pr view "$PR" --json state --jq .state)" == MERGED ]] || { echo "::error::Pull request #$PR did not merge within 40 minutes"; exit 1; }
      # Releases main's @photon-ai/mcp version when a catalog refresh set it and
      # it has no release yet: the merge above, or one an earlier run merged but
      # could not release. A version a person bumps is released by a person.
      # A release published with the App token starts release.yml, which
      # verifies, attests and publishes to npm. GITHUB_TOKEN would not.
      - name: Release the merged catalog version
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          IFS=$'\t' read -r sha subject < <(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&path=packages/mcp/package.json&per_page=1" \
            --jq '.[0] | [.sha, (.commit.message | split("\n")[0])] | @tsv')
          if [[ "$subject" != "chore(mcp): refresh the local catalog from the production API"* ]]; then
            echo "A person last changed @photon-ai/mcp's version on main; nothing to release"
            exit 0
          fi
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/packages/mcp/package.json?ref=$sha" --jq .content | base64 -d | jq -r .version)"
          if gh release view "mcp-v$version" >/dev/null 2>&1; then
            echo "mcp-v$version already exists"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          if [[ "$version" != "$VERSION" || ! -s "$notes" ]]; then
            pr="$(grep -oE '\(#[0-9]+\)$' <<<"$subject" || true)"
            echo "- Tools refreshed from the production API${pr:+ $pr}." > "$notes"
          fi
          gh release create "mcp-v$version" --target "$sha" --title "@photon-ai/mcp $version" --notes-file "$notes"
